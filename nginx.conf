# Load balancer in front of the ocr_tesseract_model replicas. Docker DNS gives `ocr_tesseract_model` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream ocr_tesseract_model {
    least_conn;
    server ocr_tesseract_model:9260 max_fails=2 fail_timeout=10s;
}

server {
    listen 9260;
    client_max_body_size 101m;  # one image, the largest max_upload_mb is 100

    location / {
        proxy_pass http://ocr_tesseract_model;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 130s;
        # Recognition is a pure function of its body, so another replica may repeat it after a connection error.
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
